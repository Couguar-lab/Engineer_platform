[tool.flake8]
max-line-length = 120
extend-ignore = ["E203", "E501"]
exclude = "venv/, .git/, __pycache__/, migrations/"

[tool.black]
line-length = 120
target-version = ['py313']

[tool.isort]
profile = "black"
line_length = 120

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "engineer_platform.settings"
python_files = "tests.py test_*.py *_tests.py"
addopts = "-ra --cov --cov-report=term-missing --cov-report=html"
testpaths = [
    "posts/tests",
    "users/tests",
    "payments/tests",
    "notifications/tests",
    "themes/tests"
]