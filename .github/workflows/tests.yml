name: Tests

on:
  pull_request:
    branches: [ "develop", "feature/yandex" ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Create fake .env for CI
      run: |
        cat > .env << EOF
        SECRET_KEY=$(openssl rand -hex 32)
        DEBUG=True
        ALLOWED_HOSTS=localhost,127.0.0.1,testserver
        DB_NAME=test_db
        DB_USER=test_user
        DB_PASSWORD=test_pass
        DB_HOST=localhost
        DB_PORT=5432
        JWT_SECRET=test_jwt_secret
        STRIPE_SECRET_KEY=sk_test_...
        STRIPE_PUBLISHABLE_KEY=pk_test_...
        STRIPE_WEBHOOK_SECRET=whsec_...
        FIREBASE_CREDENTIALS_PATH=/app/secrets/test.json
        FIREBASE_API_KEY=test_api_key
        FIREBASE_AUTH_DOMAIN=test.firebaseapp.com
        FIREBASE_PROJECT_ID=test_project
        FIREBASE_STORAGE_BUCKET=test.appspot.com
        FIREBASE_MESSAGING_SENDER_ID=123456789
        FIREBASE_APP_ID=1:123456789:web:testapp
        EOF

    - name: Erase previous coverage data
      run: coverage erase

    - name: Clear coverage cache
      run: rm -rf .coverage* htmlcov

    - name: Run tests with coverage
      run: coverage run -m pytest --no-cov-on-fail

    - name: Coverage report
      run: coverage report --fail-under=80

    - name: Coverage HTML
      run: coverage html

    - name: Upload coverage report artifact
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: htmlcov/